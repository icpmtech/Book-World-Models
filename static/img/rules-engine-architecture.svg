<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="520" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#e8eaf6">Finance Rules Engine — Infinite Pattern Discovery Architecture</text>

  <!-- Layer 1: Input Signals -->
  <rect x="20" y="60" width="820" height="90" rx="8" fill="#1a237e" stroke="#3949ab" stroke-width="1.5" opacity="0.8"/>
  <text x="430" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#c5cae9">Layer 1 — Input Signal Sources</text>

  <rect x="40" y="92" width="130" height="44" rx="6" fill="#283593" stroke="#5c6bc0" stroke-width="1"/>
  <text x="105" y="112" text-anchor="middle" font-size="11" fill="#e8eaf6">Price &amp; Volume</text>
  <text x="105" y="128" text-anchor="middle" font-size="10" fill="#9fa8da">OHLCV · Ticks</text>

  <rect x="185" y="92" width="130" height="44" rx="6" fill="#283593" stroke="#5c6bc0" stroke-width="1"/>
  <text x="250" y="112" text-anchor="middle" font-size="11" fill="#e8eaf6">Sentiment Scores</text>
  <text x="250" y="128" text-anchor="middle" font-size="10" fill="#9fa8da">NLP · LLM</text>

  <rect x="330" y="92" width="130" height="44" rx="6" fill="#283593" stroke="#5c6bc0" stroke-width="1"/>
  <text x="395" y="112" text-anchor="middle" font-size="11" fill="#e8eaf6">Macro Indicators</text>
  <text x="395" y="128" text-anchor="middle" font-size="10" fill="#9fa8da">CPI · Rates · GDP</text>

  <rect x="475" y="92" width="130" height="44" rx="6" fill="#283593" stroke="#5c6bc0" stroke-width="1"/>
  <text x="540" y="112" text-anchor="middle" font-size="11" fill="#e8eaf6">Alt Data</text>
  <text x="540" y="128" text-anchor="middle" font-size="10" fill="#9fa8da">Options · Satellite</text>

  <rect x="620" y="92" width="200" height="44" rx="6" fill="#283593" stroke="#5c6bc0" stroke-width="1"/>
  <text x="720" y="112" text-anchor="middle" font-size="11" fill="#e8eaf6">Knowledge Graph State</text>
  <text x="720" y="128" text-anchor="middle" font-size="10" fill="#9fa8da">Discovered Rules · Ontology</text>

  <!-- Arrow L1→L2 -->
  <line x1="430" y1="150" x2="430" y2="168" stroke="#7986cb" stroke-width="2" marker-end="url(#re-arrow)"/>

  <!-- Layer 2: Rule Pattern Detector -->
  <rect x="20" y="170" width="820" height="85" rx="8" fill="#1b5e20" stroke="#388e3c" stroke-width="1.5" opacity="0.8"/>
  <text x="430" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#c8e6c9">Layer 2 — Rule Pattern Detector (Infinite Loop Core)</text>

  <rect x="40" y="202" width="150" height="40" rx="6" fill="#2e7d32" stroke="#66bb6a" stroke-width="1"/>
  <text x="115" y="219" text-anchor="middle" font-size="11" fill="#e8f5e9">Statistical Miner</text>
  <text x="115" y="234" text-anchor="middle" font-size="10" fill="#a5d6a7">Corr · Coint · MI</text>

  <rect x="205" y="202" width="150" height="40" rx="6" fill="#2e7d32" stroke="#66bb6a" stroke-width="1"/>
  <text x="280" y="219" text-anchor="middle" font-size="11" fill="#e8f5e9">ML Rule Learner</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#a5d6a7">RF · XGBoost · DRL</text>

  <rect x="370" y="202" width="150" height="40" rx="6" fill="#2e7d32" stroke="#66bb6a" stroke-width="1"/>
  <text x="445" y="219" text-anchor="middle" font-size="11" fill="#e8f5e9">Causal Discoverer</text>
  <text x="445" y="234" text-anchor="middle" font-size="10" fill="#a5d6a7">PC · LiNGAM · CausalML</text>

  <rect x="535" y="202" width="150" height="40" rx="6" fill="#2e7d32" stroke="#66bb6a" stroke-width="1"/>
  <text x="610" y="219" text-anchor="middle" font-size="11" fill="#e8f5e9">LLM Abductor</text>
  <text x="610" y="234" text-anchor="middle" font-size="10" fill="#a5d6a7">GPT-4 · Claude</text>

  <rect x="700" y="202" width="120" height="40" rx="6" fill="#388e3c" stroke="#81c784" stroke-width="1.5"/>
  <text x="760" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#f1f8e9">∞ Loop</text>
  <text x="760" y="234" text-anchor="middle" font-size="10" fill="#c8e6c9">Continuous Run</text>

  <!-- Arrow L2→L3 -->
  <line x1="430" y1="255" x2="430" y2="273" stroke="#66bb6a" stroke-width="2" marker-end="url(#re-arrow)"/>

  <!-- Layer 3: Hypothesis Validation -->
  <rect x="20" y="275" width="820" height="85" rx="8" fill="#4a148c" stroke="#7b1fa2" stroke-width="1.5" opacity="0.8"/>
  <text x="430" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#e1bee7">Layer 3 — Hypothesis Validation &amp; Scoring</text>

  <rect x="40" y="307" width="160" height="40" rx="6" fill="#6a1b9a" stroke="#ce93d8" stroke-width="1"/>
  <text x="120" y="324" text-anchor="middle" font-size="11" fill="#f3e5f5">Backtesting Engine</text>
  <text x="120" y="339" text-anchor="middle" font-size="10" fill="#e1bee7">Walk-Forward · OOS</text>

  <rect x="215" y="307" width="160" height="40" rx="6" fill="#6a1b9a" stroke="#ce93d8" stroke-width="1"/>
  <text x="295" y="324" text-anchor="middle" font-size="11" fill="#f3e5f5">Statistical Tests</text>
  <text x="295" y="339" text-anchor="middle" font-size="10" fill="#e1bee7">p-value · Sharpe · IC</text>

  <rect x="390" y="307" width="160" height="40" rx="6" fill="#6a1b9a" stroke="#ce93d8" stroke-width="1"/>
  <text x="470" y="324" text-anchor="middle" font-size="11" fill="#f3e5f5">Overfitting Guard</text>
  <text x="470" y="339" text-anchor="middle" font-size="10" fill="#e1bee7">Cross-Val · MDL</text>

  <rect x="565" y="307" width="160" height="40" rx="6" fill="#6a1b9a" stroke="#ce93d8" stroke-width="1"/>
  <text x="645" y="324" text-anchor="middle" font-size="11" fill="#f3e5f5">Regime Conditioner</text>
  <text x="645" y="339" text-anchor="middle" font-size="10" fill="#e1bee7">Bull · Bear · Crisis</text>

  <!-- Arrow L3→L4 -->
  <line x1="430" y1="360" x2="430" y2="378" stroke="#ce93d8" stroke-width="2" marker-end="url(#re-arrow)"/>

  <!-- Layer 4: Knowledge Store & Feedback -->
  <rect x="20" y="380" width="820" height="80" rx="8" fill="#006064" stroke="#00838f" stroke-width="1.5" opacity="0.8"/>
  <text x="430" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#e0f7fa">Layer 4 — Finance Knowledge Store &amp; Feedback to Loop</text>

  <rect x="40" y="412" width="185" height="36" rx="6" fill="#00838f" stroke="#4dd0e1" stroke-width="1"/>
  <text x="132" y="429" text-anchor="middle" font-size="11" fill="#e0f7fa">Rule Registry (DB)</text>
  <text x="132" y="444" text-anchor="middle" font-size="10" fill="#b2ebf2">Versioned · Tagged</text>

  <rect x="240" y="412" width="185" height="36" rx="6" fill="#00838f" stroke="#4dd0e1" stroke-width="1"/>
  <text x="332" y="429" text-anchor="middle" font-size="11" fill="#e0f7fa">Signal Composer</text>
  <text x="332" y="444" text-anchor="middle" font-size="10" fill="#b2ebf2">Alpha Blend</text>

  <rect x="440" y="412" width="185" height="36" rx="6" fill="#00838f" stroke="#4dd0e1" stroke-width="1"/>
  <text x="532" y="429" text-anchor="middle" font-size="11" fill="#e0f7fa">World Model Updater</text>
  <text x="532" y="444" text-anchor="middle" font-size="10" fill="#b2ebf2">Retrain · Fine-tune</text>

  <rect x="640" y="412" width="185" height="36" rx="6" fill="#006064" stroke="#80deea" stroke-width="1.5"/>
  <text x="732" y="429" text-anchor="middle" font-size="11" font-weight="bold" fill="#e0f7fa">→ Back to Layer 1</text>
  <text x="732" y="444" text-anchor="middle" font-size="10" fill="#80deea">Infinite Re-entry</text>

  <!-- Feedback arrow on right side -->
  <path d="M 840 455 Q 870 300 840 170" fill="none" stroke="#26c6da" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#re-arrow)"/>
  <text x="848" y="315" font-size="10" fill="#26c6da" transform="rotate(-90 848 315)">∞ feedback</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="re-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7986cb"/>
    </marker>
  </defs>
</svg>
