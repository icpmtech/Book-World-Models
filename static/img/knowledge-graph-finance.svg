<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="820" height="560" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#e8eaf6">Finance Knowledge Graph — Infinite Expansion</text>

  <!-- Central node: Finance World Model -->
  <circle cx="410" cy="280" r="52" fill="#1565c0" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="410" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#e3f2fd">Finance</text>
  <text x="410" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#e3f2fd">World Model</text>
  <text x="410" y="306" text-anchor="middle" font-size="10" fill="#90caf9">z_t · b_t · π_t</text>

  <!-- Topic nodes (ring 1) -->
  <!-- Equities -->
  <circle cx="410" cy="120" r="38" fill="#283593" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="410" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#c5cae9">Equities</text>
  <text x="410" y="130" text-anchor="middle" font-size="10" fill="#9fa8da">Stock Prices</text>
  <line x1="410" y1="158" x2="410" y2="228" stroke="#5c6bc0" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Macro -->
  <circle cx="600" cy="160" r="38" fill="#1b5e20" stroke="#388e3c" stroke-width="1.5"/>
  <text x="600" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#c8e6c9">Macro</text>
  <text x="600" y="170" text-anchor="middle" font-size="10" fill="#a5d6a7">Rates · FX · GDP</text>
  <line x1="566" y1="188" x2="455" y2="248" stroke="#388e3c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Crypto -->
  <circle cx="700" cy="310" r="38" fill="#e65100" stroke="#ff7043" stroke-width="1.5"/>
  <text x="700" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#fbe9e7">Crypto</text>
  <text x="700" y="320" text-anchor="middle" font-size="10" fill="#ffab91">BTC · ETH · DeFi</text>
  <line x1="662" y1="295" x2="462" y2="280" stroke="#ff7043" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Commodities -->
  <circle cx="600" cy="430" r="38" fill="#4a148c" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="600" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#f3e5f5">Commodities</text>
  <text x="600" y="440" text-anchor="middle" font-size="10" fill="#ce93d8">Gold · Oil · Agri</text>
  <line x1="564" y1="400" x2="454" y2="322" stroke="#ab47bc" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Options -->
  <circle cx="220" cy="430" r="38" fill="#006064" stroke="#26c6da" stroke-width="1.5"/>
  <text x="220" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#e0f7fa">Options</text>
  <text x="220" y="440" text-anchor="middle" font-size="10" fill="#80deea">Vol · Greeks · Skew</text>
  <line x1="256" y1="400" x2="366" y2="322" stroke="#26c6da" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Sentiment -->
  <circle cx="120" cy="310" r="38" fill="#880e4f" stroke="#f06292" stroke-width="1.5"/>
  <text x="120" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#fce4ec">Sentiment</text>
  <text x="120" y="320" text-anchor="middle" font-size="10" fill="#f48fb1">News · Social · NLP</text>
  <line x1="158" y1="295" x2="358" y2="280" stroke="#f06292" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Bonds -->
  <circle cx="220" cy="160" r="38" fill="#bf360c" stroke="#ff7043" stroke-width="1.5"/>
  <text x="220" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#fbe9e7">Bonds</text>
  <text x="220" y="170" text-anchor="middle" font-size="10" fill="#ffab91">Yield · Duration</text>
  <line x1="254" y1="188" x2="365" y2="248" stroke="#ff7043" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Ring 2 (outer discovery nodes) -->
  <!-- Causal Rules node -->
  <rect x="350" y="55" width="120" height="35" rx="6" fill="#0d47a1" stroke="#42a5f5" stroke-width="1"/>
  <text x="410" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#bbdefb">Causal Rules</text>
  <text x="410" y="85" text-anchor="middle" font-size="9" fill="#90caf9">Rate ↑ → Growth ↓</text>
  <line x1="410" y1="90" x2="410" y2="98" stroke="#42a5f5" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Regime Detection -->
  <rect x="660" y="90" width="120" height="35" rx="6" fill="#1b5e20" stroke="#4caf50" stroke-width="1"/>
  <text x="720" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#e8f5e9">Regime Rules</text>
  <text x="720" y="120" text-anchor="middle" font-size="9" fill="#a5d6a7">Bull / Bear / Crisis</text>
  <line x1="700" y1="125" x2="630" y2="155" stroke="#4caf50" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Volatility Cluster -->
  <rect x="695" y="390" width="110" height="35" rx="6" fill="#b71c1c" stroke="#ef9a9a" stroke-width="1"/>
  <text x="750" y="406" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffebee">Vol Clusters</text>
  <text x="750" y="419" text-anchor="middle" font-size="9" fill="#ef9a9a">GARCH · VIX</text>
  <line x1="730" y1="390" x2="710" y2="370" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Seasonality -->
  <rect x="320" y="490" width="110" height="35" rx="6" fill="#37474f" stroke="#90a4ae" stroke-width="1"/>
  <text x="375" y="507" text-anchor="middle" font-size="10" font-weight="bold" fill="#eceff1">Seasonality</text>
  <text x="375" y="520" text-anchor="middle" font-size="9" fill="#b0bec5">Jan Effect · Earnings</text>
  <line x1="390" y1="490" x2="420" y2="462" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Cross-asset correlation -->
  <rect x="55" y="200" width="110" height="35" rx="6" fill="#1a237e" stroke="#7986cb" stroke-width="1"/>
  <text x="110" y="217" text-anchor="middle" font-size="10" font-weight="bold" fill="#e8eaf6">Cross-Asset</text>
  <text x="110" y="230" text-anchor="middle" font-size="9" fill="#9fa8da">Corr · Beta · PCA</text>
  <line x1="130" y1="235" x2="135" y2="270" stroke="#7986cb" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- ∞ expansion indicator -->
  <text x="410" y="543" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a2a4a">∞</text>
  <text x="410" y="556" text-anchor="middle" font-size="11" fill="#546e7a">Knowledge grows with every loop iteration</text>

  <!-- Legend -->
  <rect x="20" y="470" width="12" height="12" fill="#1565c0" rx="2"/>
  <text x="38" y="481" font-size="10" fill="#90a4ae">Core Model</text>
  <rect x="20" y="488" width="12" height="12" fill="#388e3c" rx="2"/>
  <text x="38" y="499" font-size="10" fill="#90a4ae">Domain</text>
  <rect x="20" y="506" width="12" height="12" fill="#0d47a1" rx="2"/>
  <text x="38" y="517" font-size="10" fill="#90a4ae">Discovered Rule</text>
</svg>
