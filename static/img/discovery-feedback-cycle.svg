<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="480" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#e8eaf6">Discovery Feedback Cycle — Continuous Finance Intelligence</text>

  <!-- Step 1: Observe -->
  <rect x="60" y="80" width="150" height="80" rx="10" fill="#0d47a1" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="135" y="110" text-anchor="middle" font-size="22" fill="#42a5f5">👁</text>
  <text x="135" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#e3f2fd">Observe</text>
  <text x="135" y="151" text-anchor="middle" font-size="10" fill="#90caf9">Market · News · Alt</text>

  <!-- Arrow 1→2 -->
  <path d="M 210 120 Q 265 90 310 120" fill="none" stroke="#4a90d9" stroke-width="2" marker-end="url(#dc-arrow)"/>
  <text x="260" y="106" text-anchor="middle" font-size="9" fill="#4a90d9">new data</text>

  <!-- Step 2: Encode -->
  <rect x="310" y="80" width="150" height="80" rx="10" fill="#1b5e20" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="385" y="110" text-anchor="middle" font-size="22" fill="#66bb6a">🔢</text>
  <text x="385" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8f5e9">Encode</text>
  <text x="385" y="151" text-anchor="middle" font-size="10" fill="#a5d6a7">World Model z_t</text>

  <!-- Arrow 2→3 -->
  <path d="M 460 120 Q 515 90 560 120" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#dc-arrow)"/>
  <text x="510" y="106" text-anchor="middle" font-size="9" fill="#66bb6a">latent state</text>

  <!-- Step 3: Discover -->
  <rect x="560" y="80" width="150" height="80" rx="10" fill="#4a148c" stroke="#ab47bc" stroke-width="1.5"/>
  <text x="635" y="110" text-anchor="middle" font-size="22" fill="#ab47bc">🔍</text>
  <text x="635" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#f3e5f5">Discover</text>
  <text x="635" y="151" text-anchor="middle" font-size="10" fill="#ce93d8">Rules · Patterns</text>

  <!-- Arrow 3→4 (right then down) -->
  <path d="M 710 140 Q 780 140 780 210" fill="none" stroke="#ab47bc" stroke-width="2" marker-end="url(#dc-arrow)"/>
  <text x="762" y="180" font-size="9" fill="#ab47bc">candidate</text>
  <text x="762" y="192" font-size="9" fill="#ab47bc">rule</text>

  <!-- Step 4: Validate -->
  <rect x="685" y="220" width="150" height="80" rx="10" fill="#006064" stroke="#26c6da" stroke-width="1.5"/>
  <text x="760" y="250" text-anchor="middle" font-size="22" fill="#26c6da">✅</text>
  <text x="760" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#e0f7fa">Validate</text>
  <text x="760" y="291" text-anchor="middle" font-size="10" fill="#80deea">Backtest · Stats</text>

  <!-- Arrow 4→5 (down then left) -->
  <path d="M 760 300 Q 760 370 700 390" fill="none" stroke="#26c6da" stroke-width="2" marker-end="url(#dc-arrow)"/>
  <text x="744" y="355" font-size="9" fill="#26c6da">validated</text>
  <text x="744" y="367" font-size="9" fill="#26c6da">rule</text>

  <!-- Step 5: Store & Apply -->
  <rect x="500" y="370" width="180" height="80" rx="10" fill="#bf360c" stroke="#ff7043" stroke-width="1.5"/>
  <text x="590" y="400" text-anchor="middle" font-size="22" fill="#ff7043">💾</text>
  <text x="590" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#fbe9e7">Store &amp; Apply</text>
  <text x="590" y="441" text-anchor="middle" font-size="10" fill="#ffab91">Rule DB · Signal</text>

  <!-- Arrow 5→6 (left) -->
  <path d="M 500 415 Q 440 415 380 415" fill="none" stroke="#ff7043" stroke-width="2" marker-end="url(#dc-arrow)"/>
  <text x="440" y="408" text-anchor="middle" font-size="9" fill="#ff7043">knowledge update</text>

  <!-- Step 6: Refine World Model -->
  <rect x="170" y="370" width="200" height="80" rx="10" fill="#f57f17" stroke="#ffca28" stroke-width="1.5"/>
  <text x="270" y="400" text-anchor="middle" font-size="22" fill="#ffca28">🔄</text>
  <text x="270" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff8e1">Refine Model</text>
  <text x="270" y="441" text-anchor="middle" font-size="10" fill="#ffe082">Retrain · Fine-tune</text>

  <!-- Arrow 6→1 (back to start — infinite loop) -->
  <path d="M 170 415 Q 80 415 80 290 Q 80 180 110 160" fill="none" stroke="#ffca28" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#dc-arrow-gold)"/>
  <text x="28" y="340" font-size="10" fill="#ffca28" transform="rotate(-90 28 340)">∞ loop</text>

  <!-- Center label -->
  <text x="430" y="300" text-anchor="middle" font-size="36" fill="#1a2a4a" font-weight="bold" opacity="0.5">∞</text>
  <text x="430" y="340" text-anchor="middle" font-size="11" fill="#546e7a">Every cycle = new finance knowledge</text>

  <!-- Step labels -->
  <text x="135" y="175" text-anchor="middle" font-size="10" fill="#42a5f5">① Observe</text>
  <text x="385" y="175" text-anchor="middle" font-size="10" fill="#66bb6a">② Encode</text>
  <text x="635" y="175" text-anchor="middle" font-size="10" fill="#ab47bc">③ Discover</text>
  <text x="760" y="315" text-anchor="middle" font-size="10" fill="#26c6da">④ Validate</text>
  <text x="590" y="462" text-anchor="middle" font-size="10" fill="#ff7043">⑤ Store</text>
  <text x="270" y="462" text-anchor="middle" font-size="10" fill="#ffca28">⑥ Refine</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="dc-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
    <marker id="dc-arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffca28"/>
    </marker>
  </defs>
</svg>
