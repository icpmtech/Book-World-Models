  <text x="460" y="437" text-anchor="middle" font-size="10" fill="#94a3b8">Rate-limit management · Auth token rotation · Retry / circuit-breaker · Schema normalization · Kafka topics</text>
  <text x="460" y="453" text-anchor="middle" font-size="10" fill="#94a3b8">Connector: REST adapter → Avro schema → topic:{social, news, market, alt} → Consumer groups</text>
  <text x="460" y="467" text-anchor="middle" font-size="10" fill="#64748b">Dead-letter queue · Backpressure control · End-to-end latency monitoring (P99 &lt; 500ms)</text>

  <!-- Arrows from each column to gateway -->
  <line x1="112" y1="362" x2="112" y2="388" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#aB)"/>
  <line x1="352" y1="362" x2="352" y2="388" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#aA)"/>
  <line x1="597" y1="362" x2="597" y2="388" stroke="#22c55e" stroke-width="1.5" marker-end="url(#aG)"/>
  <line x1="807" y1="362" x2="807" y2="388" stroke="#a855f7" stroke-width="1.5" marker-end="url(#aP)"/>

