  <text x="770" y="542" text-anchor="middle" font-size="10" fill="#166534">Real-time Dashboard</text>

  <line x1="460" y1="472" x2="460" y2="498" stroke="#10b981" stroke-width="2" marker-end="url(#aG)"/>
