  <text x="807" y="284" text-anchor="middle" font-size="9" fill="#6b21a8">Scrapy · BeautifulSoup</text>

  <rect x="720" y="305" width="175" height="55" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
